[project]
name = "stock-analyzer"
version = "1.1.0"
description = "A股股票技术分析工具 - 集成14项技术指标、量价分析、价格预测、特征工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
stock-analyzer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]